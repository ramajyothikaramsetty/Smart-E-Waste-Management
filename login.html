<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Smart E-Waste</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
        }

        .login-container {
            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 360px;
            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.15);

            text-align: center;
        }

        .logo {
            font-size: 50px;
        }

        .login-card h1 {
            color: #1b5e20;
            margin-bottom: 5px;
        }

        .login-card p {
            color: #666;
        }

        .login-card label {
            display: block;
            text-align: left;
            margin-top: 18px;
            font-weight: bold;
        }

        .login-card input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;

            margin-top: 7px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }

        .login-card button {
            width: 100%;

            padding: 13px;

            margin-top: 25px;

            border: none;

            border-radius: 7px;

            background: #2e7d32;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-card button:hover {
            background: #1b5e20;
        }

        #loginMessage {
            margin-top: 15px;
            font-weight: bold;
        }

        .back-home {
            display: inline-block;

            margin-top: 20px;

            color: #2e7d32;

            text-decoration: none;
        }

        .demo {
            margin-top: 20px;

            background: #f1f8e9;

            padding: 12px;

            border-radius: 8px;

            font-size: 13px;
        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-card">

        <div class="logo">
            ♻️
        </div>

        <h1>
            Smart E-Waste
        </h1>

        <p>
            Admin Login
        </p>


        <form id="loginForm">

            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                🔐 Login
            </button>

        </form>


        <p id="loginMessage"></p>


        <div class="demo">

            <strong>Demo Admin</strong>

            <br>

            Email:
            admin@ewaste.com

            <br>

            Password:
            admin123

        </div>


        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Home
        </a>

    </div>

</div>


<script src="login.js"></script>

</body>

</html>
